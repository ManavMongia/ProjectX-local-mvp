<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>ProjectX - Search Your Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/style.css">
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/auth.js"></script>
  <script type="module" src="/demo-data.js"></script>
  <style>
    #map { background: #f8fafc; }
    .leaflet-popup-content-wrapper { border-radius: 20px; padding: 4px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15); }
    .leaflet-popup-tip { display: none; }
    .leaflet-container { font-family: 'Outfit', sans-serif !important; }
    
    /* Interactive Custom Map Pins */
    .map-pin-wrapper {
        position: relative;
        transform: translate(-50%, -50%);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: white;
        border-radius: 999px;
        padding: 4px 10px 4px 6px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        white-space: nowrap;
    }
    .map-pin-wrapper:hover {
        transform: translate(-50%, -50%) scale(1.08);
        box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    }
    .map-pin-wrapper.active-pin {
        background: #0f172a !important;
        border-color: #0f172a !important;
        color: white !important;
        transform: translate(-50%, -50%) scale(1.15) !important;
        box-shadow: 0 10px 25px rgba(15,23,42,0.35) !important;
        z-index: 1000 !important;
    }
    .map-pin-wrapper.active-pin .pin-label {
        color: white !important;
    }
    .map-pin-wrapper.active-pin .pin-dot {
        background: white !important;
    }

    /* View Toggle Buttons */
    .view-toggle-btn.active {
      background: #0f172a;
      color: white;
    }

    /* Full List Responsive Grid */
    .full-list-grid {
      display: grid !important;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)) !important;
      gap: 1.5rem !important;
      padding: 1.5rem !important;
    }
    .full-list-grid > div {
      margin-top: 0 !important;
      margin-bottom: 0 !important;
    }

    /* Mobile Bottom Sheet */
    @media (max-width: 767px) {
      #list-pane {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: white;
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
        transition: height 0.3s cubic-bezier(0.32, 0.72, 0, 1);
        z-index: 100;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
    }
    #drag-handle {
      cursor: grab;
      flex-shrink: 0;
      padding: 10px 0 6px;
      touch-action: none;
    }
    #drag-handle-pill {
      width: 38px;
      height: 4px;
      background: #cbd5e1;
      border-radius: 2px;
      margin: 0 auto;
    }
    #list-pane .list-scroll-area {
      flex: 1;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body class="bg-white text-slate-900 font-['Outfit'] antialiased h-screen overflow-hidden flex flex-col">
  <!-- Top Navigation (Shared Header) -->
  <nav class="w-full z-50 bg-white border-b border-slate-200 shadow-sm h-16 shrink-0 flex items-center">
    <div class="max-w-[1400px] mx-auto px-6 w-full flex items-center justify-between gap-8">
      <div class="flex items-center gap-2">
        <a href="/index.html" class="text-xl font-black tracking-tighter text-slate-900">ProjectX</a>
      </div>
      <div class="hidden md:flex items-center gap-8">
        <a class="text-[13px] font-black text-slate-900 border-b-2 border-slate-900 uppercase tracking-widest pb-1" href="/map.html">Search Your Home</a>
        <!-- Services Dropdown -->
        <div class="relative group">
          <button class="text-[13px] font-bold text-slate-500 hover:text-slate-900 transition-colors uppercase tracking-widest pb-1 flex items-center gap-1">
            Services
            <span class="material-symbols-outlined text-[16px]">expand_more</span>
          </button>
          <div class="absolute top-full left-0 mt-2 w-48 bg-white border border-slate-200 rounded-xl shadow-xl overflow-hidden opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
            <a href="/sell.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-slate-900 transition-colors">
              <span class="material-symbols-outlined text-[18px] text-slate-400">sell</span>
              Sell Property
            </a>
            <a href="/sell.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-slate-900 transition-colors border-t border-slate-100">
              <span class="material-symbols-outlined text-[18px] text-slate-400">home</span>
              Rent Your Property
            </a>
          </div>
        </div>
      </div>
      <!-- Trailing actions: Sign In / Sign Up or Role-based items -->
      <div class="flex items-center gap-4">
        <button class="text-slate-500 hover:text-slate-900 transition-colors">
          <span class="material-symbols-outlined text-[24px]">account_circle</span>
        </button>
        <button class="bg-slate-900 text-white px-5 py-2 rounded-lg font-bold text-xs hover:bg-slate-800 transition-colors uppercase tracking-wider ml-2">Dashboard</button>
      </div>
    </div>
  </nav>

  <!-- Search & Filter Controls Top Bar -->
  <div class="bg-white border-b border-slate-200 shrink-0 z-40">
    <div class="max-w-[1400px] mx-auto px-4 py-2.5 flex flex-wrap items-center gap-3 justify-between">
      <!-- Search Bar -->
      <div class="flex-1 min-w-[260px] max-w-md relative">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]">search</span>
        <input type="text" id="listing-search-input"
          class="w-full pl-9 pr-8 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900 transition-all"
          placeholder="Search by city, neighborhood, or title..." autocomplete="off">
        <input type="hidden" id="map-location-search">
        <button id="search-clear-btn" type="button" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700">
          <span class="material-symbols-outlined text-[16px]">cancel</span>
        </button>
        <div id="map-search-results" class="absolute left-0 right-0 top-full mt-1 bg-white rounded-xl shadow-xl border border-slate-200 overflow-hidden hidden flex-col max-h-60 overflow-y-auto z-[1050]"></div>
      </div>

      <!-- Controls: Filters, Intent, Sorting, View Switcher -->
      <div class="flex items-center gap-2 flex-wrap">
        <!-- Centralized Filters Button -->
        <button id="open-filters-btn"
          class="flex items-center gap-1.5 px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs font-bold text-slate-800 hover:border-slate-900 hover:bg-slate-50 transition-all shadow-2xs cursor-pointer active:scale-[0.98]"
          aria-label="Open Filters" aria-haspopup="dialog">
          <span class="material-symbols-outlined text-[16px]">tune</span>
          <span>Filters</span>
          <span id="active-filters-badge" class="hidden bg-slate-900 text-white text-[10px] font-black px-1.5 py-0.5 rounded-full min-w-[18px] text-center leading-none">0</span>
        </button>

        <!-- Intent Quick Pills -->
        <div class="hidden sm:flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200">
          <button data-intent="all" class="intent-btn px-2.5 py-1.5 rounded-md text-[10px] font-black uppercase tracking-wider bg-slate-900 text-white transition-all">All</button>
          <button data-intent="Buy" class="intent-btn px-2.5 py-1.5 rounded-md text-[10px] font-black uppercase tracking-wider bg-slate-100 text-slate-500 hover:bg-slate-200 transition-all">Buy</button>
          <button data-intent="Rent" class="intent-btn px-2.5 py-1.5 rounded-md text-[10px] font-black uppercase tracking-wider bg-slate-100 text-slate-500 hover:bg-slate-200 transition-all">Rent</button>
        </div>

        <!-- Sort Dropdown -->
        <div class="relative">
          <select id="sort-dropdown" class="appearance-none bg-slate-50 border border-slate-200 text-slate-700 py-2 pl-3 pr-7 rounded-lg text-xs font-bold cursor-pointer hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 transition-all">
            <option value="default">Sort: Recommended</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="newest">Newest First</option>
          </select>
          <span class="material-symbols-outlined text-slate-400 text-[16px] absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none">expand_more</span>
        </div>

        <!-- Full-Screen View Switcher (Combined View, Full Map, Full List) -->
        <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200">
          <button id="toggle-split" class="view-toggle-btn active flex items-center gap-1 px-2.5 py-1.5 rounded-md text-[11px] font-black uppercase tracking-wider transition-all" title="Combined View: Map + Side List" aria-label="Combined View">
            <span class="material-symbols-outlined text-[16px]">view_sidebar</span>
            <span class="hidden sm:inline">Combined View</span>
          </button>
          <button id="toggle-map" class="view-toggle-btn flex items-center gap-1 px-2.5 py-1.5 rounded-md text-[11px] font-black uppercase tracking-wider text-slate-500 hover:text-slate-900 transition-all" title="Full Map: Expanded Map" aria-label="Full Map">
            <span class="material-symbols-outlined text-[16px]">map</span>
            <span class="hidden sm:inline">Full Map</span>
          </button>
          <button id="toggle-list" class="view-toggle-btn flex items-center gap-1 px-2.5 py-1.5 rounded-md text-[11px] font-black uppercase tracking-wider text-slate-500 hover:text-slate-900 transition-all" title="Full List: Expanded Property List" aria-label="Full List">
            <span class="material-symbols-outlined text-[16px]">view_list</span>
            <span class="hidden sm:inline">Full List</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Active Filter Chips Container -->
    <div id="active-filter-chips-container" class="hidden max-w-[1400px] mx-auto px-4 py-2 border-t border-slate-100 flex-wrap items-center gap-2"></div>
  </div>

  <!-- Main Split Layout (Side List on Left, Map on Right) -->
  <main id="main-split" class="flex-grow flex flex-col md:flex-row overflow-hidden min-h-0 relative">
    <!-- Property Side List (Left on Desktop, Bottom Sheet on Mobile) -->
    <section id="list-pane" class="w-full md:w-[480px] lg:w-[520px] bg-white border-r border-slate-200 flex flex-col overflow-hidden shrink-0 z-10 transition-all duration-300">
      <!-- Mobile drag handle -->
      <div id="drag-handle" aria-label="Drag to resize" class="md:hidden">
        <div id="drag-handle-pill"></div>
      </div>

      <!-- Header bar inside list pane -->
      <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between shrink-0 bg-white">
        <div>
          <h2 class="text-sm font-black text-slate-900 tracking-tight">Available Homes</h2>
          <p class="text-slate-400 text-[10px] font-bold uppercase tracking-wider" id="listings-count-text">Loading listings...</p>
        </div>
        <p class="text-slate-400 text-[10px] font-black uppercase tracking-widest hidden" id="map-listings-count"></p>
        <p class="text-slate-400 text-[10px] font-black uppercase tracking-widest hidden" id="map-listings-count-toolbar"></p>
      </div>

      <!-- Scrollable listings container -->
      <div id="property-side-list" class="list-scroll-area overflow-y-auto p-4 md:p-6 space-y-6 flex-1">
        <!-- Listing cards rendered dynamically by map.js -->
      </div>
    </section>

    <!-- Interactive Property Map (Right on Desktop) -->
    <section id="map-pane" class="w-full flex-1 bg-slate-100 relative min-h-0 transition-all duration-300">
      <div id="map" class="absolute inset-0 z-0"></div>
    </section>
  </main>
</body>
</html>
